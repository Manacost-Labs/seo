name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: indexpilot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, openssl, intl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer lint
        if: matrix.php == '8.3'

  php81:
    name: PHP 8.1 — синтаксис
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: find indexpilot/src indexpilot/indexpilot.php indexpilot/uninstall.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test indexpilot/tests/js/*.test.js
